# Local server version: Next.js app + PostgreSQL.
# Setup: cp backend/config/.env.example backend/config/.env
# Start: docker compose up -d   ->   http://localhost:3001
services:
  db:
    image: postgres:16-alpine
    env_file: backend/config/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
    env_file: backend/config/.env
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
