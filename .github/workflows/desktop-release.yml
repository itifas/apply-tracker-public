# Builds the desktop app when a platform branch is updated:
#   windows -> .exe installer
#   macos   -> .dmg and .zip (Intel and Apple Silicon)
#   linux   -> .AppImage, .deb (Debian/Ubuntu), .rpm (Fedora)
#
# The installer is added to the GitHub Release for the version in
# desktop/package.json (e.g. v0.1.0), creating the release if needed, so all
# platforms of one version share one release. Installed apps check the latest
# release for updates on launch.
#
# To ship a version: bump "version" in desktop/package.json on main, then
# update the platform branches from main and push them.
name: Desktop release

on:
  push:
    branches: [windows, macos, linux]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: >-
      ${{ github.ref_name == 'windows' && 'windows-latest'
       || github.ref_name == 'macos' && 'macos-latest'
       || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: frontend

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Build web app
        run: npm run build:web
        working-directory: desktop

      - name: Install Linux packaging tools
        if: github.ref_name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build installer
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            windows) target=--win ;;
            macos) target=--mac ;;
            *) target=--linux ;;
          esac
          npx electron-builder $target --publish never
        working-directory: desktop
        env:
          # No code-signing certificates yet; build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    if: contains(fromJSON('["windows","macos","linux"]'), github.ref_name)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            desktop/package.json
            desktop/RELEASE_NOTES.md

      - uses: actions/download-artifact@v8
        with:
          name: desktop-${{ github.ref_name }}
          path: dist

      - name: Add installer to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          tag="v$version"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          sed -e "s|{{VERSION}}|$tag|g" -e "s|{{V}}|$version|g" -e "s|{{URL}}|$url|g" \
            desktop/RELEASE_NOTES.md > notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Apply Tracker $tag" --notes-file notes.md
          fi
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
