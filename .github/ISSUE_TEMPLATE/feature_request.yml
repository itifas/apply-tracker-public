name: Feature idea
description: Suggest something that would make tracking applications easier.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation in your job search where the app falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
